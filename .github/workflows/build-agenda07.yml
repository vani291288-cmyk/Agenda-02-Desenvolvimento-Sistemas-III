name: Build Agenda 07 - Tempo Agora

on:
  push:
    paths:
      - 'Agenda07-TempoAgora/**'
      - '.github/workflows/build-agenda07.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Instalar workload MAUI Android
        run: dotnet workload install maui-android

      - name: Restaurar dependências
        run: dotnet restore Agenda07-TempoAgora/MauiAppTempoAgora.csproj

      - name: Compilar APK
        run: dotnet build Agenda07-TempoAgora/MauiAppTempoAgora.csproj -f net10.0-android -c Release --no-restore

      - name: Localizar APK
        run: find Agenda07-TempoAgora/bin/Release/net10.0-android -type f -name '*.apk' -print

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Agenda07-TempoAgora-apk
          path: Agenda07-TempoAgora/bin/Release/net10.0-android/**/*.apk
