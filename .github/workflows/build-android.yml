name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Instalar .NET MAUI
        run: dotnet workload install maui

      - name: Restaurar dependências
        run: dotnet restore "Agenda_02_Desenvolvimento_Sistemas_III_MauiAppMinhasCompras/MauiAppMinhasCompras.csproj"

      - name: Gerar APK Android
        run: dotnet publish "Agenda_02_Desenvolvimento_Sistemas_III_MauiAppMinhasCompras/MauiAppMinhasCompras.csproj" -f net10.0-android35.0 -c Debug -p:AndroidPackageFormat=apk -o ./artifacts

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: MauiAppMinhasCompras-apk
          path: ./artifacts/*.apk
